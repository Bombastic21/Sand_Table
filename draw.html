<!DOCTYPE html>
<html>
<head>
    <title>Draw & Convert to G-Code</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1 { margin-bottom: 20px; }

        canvas {
            border: 2px solid #333;
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .text-controls {
            border: 2px solid #9b59b6;
            border-radius: 5px;
            padding: 10px;
            background-color: #f5e6ff;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .text-controls label {
            font-weight: bold;
            color: #9b59b6;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
        }

        button:hover { background-color: #2980b9; }

        #clearBtn { background-color: #e74c3c; }
        #clearBtn:hover { background-color: #c0392b; }

        #downloadBtn { background-color: #27ae60; }
        #downloadBtn:hover { background-color: #229954; }

        #backBtn { background-color: #95a5a6; }
        #backBtn:hover { background-color: #7f8c8d; }

        #gcodePreview {
            width: 400px;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
            background: #1a252f;
            color: #1abc9c;
            border: 1px solid #34495e;
            padding: 10px;
            border-radius: 5px;
            overflow: auto;
        }

        #textInput {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            min-width: 150px;
        }

        #fontSizeInput {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            width: 80px;
        }

        #fontSelect {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
        }

        #addTextBtn { background-color: #9b59b6; }
        #addTextBtn:hover { background-color: #8e44ad; }

        #deleteTextBtn { background-color: #e74c3c; }
        #deleteTextBtn:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <h1>Draw & Convert to G-Code</h1>
    <p style="color: #667; margin: 0 0 20px 0;">Sand Table: 370mm × 370mm</p>
    
    <div class="controls">
        <button id="downloadBtn">Download G-Code</button>
        <input type="text" id="filenameInput" placeholder="filename" value="drawing">
        <span>.gcode</span>
        <button id="clearBtn">Clear Canvas</button>
        <button id="backBtn">Back to Menu</button>
    </div>

    <div class="text-controls">
        <label>Text Tools:</label>
        <input type="text" id="textInput" placeholder="Enter text (A-Z, 0-9)">
        <select id="fontSelect" style="display:none;">
            <option value="Stick">Stick Font</option>
        </select>
        <input type="number" id="fontSizeInput" placeholder="Font size" value="40" min="10" max="150">
        <button id="addTextBtn">Add Text</button>
        <button id="deleteTextBtn">Delete Text</button>
    </div>

    <canvas id="drawingCanvas" width="500" height="500"></canvas>

    <h3>G-Code Preview:</h3>
    <textarea id="gcodePreview" readonly></textarea>

    <script>
        // --- NEW: Stick Font Definition (A-Z, 0-9) ---
        const fontData = {
            'A': [[0,20, 5,0, 10,20], [2,12, 8,12]], 'B': [[0,20, 0,0, 8,0, 10,2, 10,8, 8,10, 0,10, 8,10, 10,12, 10,18, 8,20, 0,20]],
            // A: Draws left leg, right leg, retraces up right leg, draws crossbar, retraces crossbar, back down right leg
            'A': [[0,20, 5,0, 10,20, 8,12, 2,12, 8,12, 10,20]], 
            // B, C, D were already single continuous strokes!
            'B': [[0,20, 0,0, 8,0, 10,2, 10,8, 8,10, 0,10, 8,10, 10,12, 10,18, 8,20, 0,20]],
            'C': [[10,5, 8,2, 5,0, 2,2, 0,5, 0,15, 2,18, 5,20, 8,18, 10,15]], 
            'D': [[0,20, 0,0, 6,0, 10,4, 10,16, 6,20, 0,20]],
            // E: Draws top, down back, across middle, retraces middle, down back, across bottom
            'E': [[10,0, 0,0, 0,10, 8,10, 0,10, 0,20, 10,20]], 
            // F: Retraces middle bar and back up to top bar
            'F': [[0,20, 0,10, 8,10, 0,10, 0,0, 10,0]],
            'G': [[10,5, 8,2, 5,0, 2,2, 0,5, 0,15, 2,18, 5,20, 8,18, 10,15, 10,10, 6,10]], 
            // H: Left leg, retraces to middle, across middle, up right leg, retraces down right leg
            'H': [[0,0, 0,20, 0,10, 10,10, 10,0, 10,20]],
            // I: Top bar, retraces to middle, down middle, left bottom, retraces to right bottom
            'I': [[0,0, 10,0, 5,0, 5,20, 0,20, 10,20]], 
            'J': [[8,0, 8,15, 6,19, 2,19, 0,15]],
            // K: Retraces left leg, up top diagonal, retraces to middle, down bottom diagonal
            'K': [[0,0, 0,20, 0,10, 2,10, 10,0, 2,10, 10,20]], 
            'L': [[0,0, 0,20, 10,20]], 
            'M': [[0,20, 0,0, 5,10, 10,0, 10,20]],
            'N': [[0,20, 0,0, 10,20, 10,0]], 
            'O': [[5,0, 2,2, 0,5, 0,15, 2,18, 5,20, 8,18, 10,15, 10,5, 8,2, 5,0]],
            'P': [[0,20, 0,0, 8,0, 10,2, 10,8, 8,10, 0,10]], 
            // Q: Draws O, then retraces down right side of O to draw the tail
            'Q': [[5,0, 2,2, 0,5, 0,15, 2,18, 5,20, 8,18, 10,15, 10,5, 8,2, 5,0, 8,2, 10,5, 10,15, 8,18, 6,15, 10,20]],
            'R': [[0,20, 0,0, 8,0, 10,2, 10,8, 8,10, 0,10, 4,10, 10,20]], 
            'S': [[10,5, 8,2, 5,0, 2,2, 0,5, 1,9, 9,11, 10,15, 8,18, 5,20, 2,18, 0,15]],
            // T: Retraces half of top bar to get to center
            'T': [[5,20, 5,0, 0,0, 10,0]], 
            'U': [[0,0, 0,16, 2,20, 8,20, 10,16, 10,0]], 
            'V': [[0,0, 5,20, 10,0]],
            'W': [[0,0, 2,20, 5,12, 8,20, 10,0]], 
            // X: Diagonal 1, retraces to center, diagonal 2, retraces to center
            'X': [[0,0, 10,20, 5,10, 10,0, 5,10, 0,20]], 
            // Y: Top diagonals, retraces to center, down bottom stem
            'Y': [[0,0, 5,10, 10,0, 5,10, 5,20]], 
            'Z': [[0,0, 10,0, 0,20, 10,20]],
            // 0: Connects slash to outer border by tracing a bit of the border
            '0': [[8,0, 2,20, 2,16, 5,20, 8,16, 8,4, 5,0, 2,4, 2,16]], 
            // 1: Top down, retraces half of bottom bar
            '1': [[2,5, 5,0, 5,20, 2,20, 8,20]],
            '2': [[0,5, 2,2, 5,0, 8,2, 8,7, 0,20, 10,20]], 
            '3': [[0,2, 2,0, 8,0, 10,3, 7,7, 9,10, 10,16, 7,20, 2,20, 0,17]],
            // 4: Down, across, retraces middle across, up, retraces down
            '4': [[0,0, 0,10, 10,10, 7,10, 7,0, 7,20]], 
            '5': [[9,0, 1,0, 0,8, 1,7, 8,7, 10,12, 9,18, 5,20, 1,18, 0,15]],
            '6': [[9,2, 6,0, 2,4, 0,10, 1,17, 5,20, 9,17, 9,10, 0,10]], 
            '7': [[0,0, 10,0, 4,20]],
            // 8: Figure 8 trace (no pen lift required)
            '8': [[5,0, 2,2, 2,8, 5,10, 2,12, 2,18, 5,20, 8,18, 8,12, 5,10, 8,8, 8,2, 5,0]],
            '9': [[1,18, 4,20, 8,16, 10,10, 9,3, 5,0, 1,3, 1,10, 10,10]], 
            ' ': [], 
            // Colon: draws top dot, physically draws line to bottom dot.
            ':': [[5,5, 5,7, 5,13, 5,15]] 
        };
        // ------------------------------------------

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const backBtn = document.getElementById('backBtn');
        const addTextBtn = document.getElementById('addTextBtn');
        const deleteTextBtn = document.getElementById('deleteTextBtn');
        const textInput = document.getElementById('textInput');
        const fontSelect = document.getElementById('fontSelect');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const gcodePreview = document.getElementById('gcodePreview');

        let isDrawing = false;
        let strokes = [];
        let currentStroke = [];
        let textElements = [];
        let isAddingText = false;
        let selectedTextIndex = -1;
        let draggingHandle = null;
        let draggingText = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartTextX = 0;
        let dragStartTextY = 0;

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        function startDrawing(event) {
            if (isAddingText) return; 
            if (draggingText) return; 
            
            if (selectedTextIndex >= 0) {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                const textElem = textElements[selectedTextIndex];
                // Text Width Calculation Change:
                const textWidth = textElem.text.length * (textElem.fontSize * 0.6); 
                const textHeight = textElem.fontSize;
                
                const handleSize = 8;
                const bottom = textElem.y + textHeight;
                const right = textElem.x + textWidth;
                
                if ((x >= right - handleSize && x <= right + handleSize &&
                     y >= bottom - handleSize && y <= bottom + handleSize) ||
                    (x >= textElem.x && x <= textElem.x + textWidth &&
                     y >= textElem.y && y <= textElem.y + textHeight)) {
                    return;
                }
            }
            
            isDrawing = true;
            currentStroke = [];
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            currentStroke.push({ x, y });
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function draw(event) {
            if (!isDrawing || draggingHandle) return;
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            currentStroke.push({ x, y });
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function stopDrawing() {
            if (isDrawing && currentStroke.length > 0) {
                strokes.push(currentStroke);
                isDrawing = false;
                updateGcodePreview();
            }
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw strokes
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (let stroke of strokes) {
                if (stroke.length === 0) continue;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            }
            
            // --- UPDATED TEXT DRAWING FOR STICK FONT ---
            for (let i = 0; i < textElements.length; i++) {
                const textElem = textElements[i];
                const scale = textElem.fontSize / 20; 
                let cursorX = textElem.x;
                const charSpacing = 12 * scale;
                
                ctx.beginPath();
                ctx.strokeStyle = '#000000';
                
                const str = textElem.text.toUpperCase();
                for(let char of str) {
                    if(fontData[char]) {
                        for(let line of fontData[char]) {
                            ctx.moveTo(cursorX + line[0] * scale, textElem.y + line[1] * scale);
                            for(let k=2; k<line.length; k+=2) {
                                ctx.lineTo(cursorX + line[k] * scale, textElem.y + line[k+1] * scale);
                            }
                        }
                    }
                    cursorX += charSpacing;
                }
                ctx.stroke();

                // Draw selection box
                if (i === selectedTextIndex) {
                    const textWidth = textElem.text.length * (textElem.fontSize * 0.6);
                    const textHeight = textElem.fontSize;
                    ctx.strokeStyle = '#3498db';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(textElem.x - 2, textElem.y - 2, textWidth + 4, textHeight + 4);
                    
                    const handleSize = 8;
                    ctx.fillStyle = '#3498db';
                    ctx.fillRect(textElem.x + textWidth - 2 - handleSize/2, 
                                 textElem.y + textHeight - 2 - handleSize/2, 
                                 handleSize, handleSize);
                }
            }
        }

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes = [];
            currentStroke = [];
            textElements = [];
            gcodePreview.value = '';
        });

        backBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        addTextBtn.addEventListener('click', () => {
            if (textInput.value.trim() === '') {
                alert('Please enter text first!');
                return;
            }
            isAddingText = true;
            canvas.style.cursor = 'crosshair';
            canvas.title = 'Click to place text';
        });

        deleteTextBtn.addEventListener('click', () => {
            if (selectedTextIndex >= 0) {
                textElements.splice(selectedTextIndex, 1);
                selectedTextIndex = -1;
                redrawCanvas();
                updateGcodePreview();
            } else {
                alert('Please select text to delete!');
            }
        });

        canvas.addEventListener('click', (event) => {
            if (isAddingText) {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                textElements.push({
                    text: textInput.value,
                    x: x,
                    y: y,
                    fontSize: parseInt(fontSizeInput.value),
                    font: 'Stick' 
                });
                redrawCanvas();
                textInput.value = '';
                isAddingText = false;
                canvas.style.cursor = 'crosshair';
                canvas.title = '';
                updateGcodePreview();
            } else {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                selectedTextIndex = -1;
                for (let i = 0; i < textElements.length; i++) {
                    const textElem = textElements[i];
                    // Stick Font Width Calc
                    const textWidth = textElem.text.length * (textElem.fontSize * 0.6);
                    const textHeight = textElem.fontSize;
                    
                    if (x >= textElem.x && x <= textElem.x + textWidth &&
                        y >= textElem.y && y <= textElem.y + textHeight) {
                        selectedTextIndex = i;
                        fontSizeInput.value = textElem.fontSize;
                        break;
                    }
                }
                redrawCanvas();
            }
        });

        canvas.addEventListener('mousedown', (event) => {
            if (selectedTextIndex >= 0) {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                const textElem = textElements[selectedTextIndex];
                // Stick Font Width Calc
                const textWidth = textElem.text.length * (textElem.fontSize * 0.6);
                const textHeight = textElem.fontSize;
                
                const handleSize = 8;
                const bottom = textElem.y + textHeight;
                const right = textElem.x + textWidth;
                
                if (x >= right - handleSize && x <= right + handleSize &&
                    y >= bottom - handleSize && y <= bottom + handleSize) {
                    draggingHandle = 'bottom-right';
                    dragStartY = y;
                } 
                else if (x >= textElem.x && x <= textElem.x + textWidth &&
                         y >= textElem.y && y <= textElem.y + textHeight) {
                    draggingText = true;
                    dragStartX = x;
                    dragStartY = y;
                    dragStartTextX = textElem.x;
                    dragStartTextY = textElem.y;
                }
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            if (draggingText && selectedTextIndex >= 0) {
                const xDelta = x - dragStartX;
                const yDelta = y - dragStartY;
                textElements[selectedTextIndex].x = dragStartTextX + xDelta;
                textElements[selectedTextIndex].y = dragStartTextY + yDelta;
                redrawCanvas();
                updateGcodePreview();
            } else if (selectedTextIndex >= 0) {
                const textElem = textElements[selectedTextIndex];
                // Stick Font Width Calc
                const textWidth = textElem.text.length * (textElem.fontSize * 0.6);
                const textHeight = textElem.fontSize;
                
                const handleSize = 8;
                const bottom = textElem.y + textHeight;
                const right = textElem.x + textWidth;
                
                if (x >= right - handleSize && x <= right + handleSize &&
                    y >= bottom - handleSize && y <= bottom + handleSize) {
                    canvas.style.cursor = 'se-resize';
                } else if (x >= textElem.x && x <= textElem.x + textWidth &&
                           y >= textElem.y && y <= textElem.y + textHeight) {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = 'default';
                }
            }
            
            if (draggingHandle === 'bottom-right') {
                const yDelta = y - dragStartY;
                const newSize = Math.max(8, textElements[selectedTextIndex].fontSize + yDelta);
                textElements[selectedTextIndex].fontSize = newSize;
                dragStartY = y;
                redrawCanvas();
                updateGcodePreview();
            }
        });

        canvas.addEventListener('mouseup', () => {
            draggingHandle = null;
            draggingText = false;
        });

        canvas.addEventListener('mouseleave', () => {
            draggingHandle = null;
            draggingText = false;
        });

        downloadBtn.addEventListener('click', downloadGCode);

        function convertToGCode() {
            let gcode = [];
            gcode.push('G90'); 
            gcode.push('G21'); 

            // 370mm x 370mm sand table
            const tableSize = 370; 
            const canvasSize = 500; 
            const scale = tableSize / canvasSize; 
            const offsetX = 0;
            const offsetY = 0;

            // --- AXIS FLIP TOGGLES ---
            // Adjust these to true/false to match your physical sand table's orientation
            const flipX = true; // Set to false to stop X from flipping
            const flipY = false;  // Set to true to keep Y flipped

            // Helper functions to handle coordinate scaling and flipping
            function getX(canvasX) {
                let x = canvasX * scale + offsetX;
                return flipX ? tableSize - x : x;
            }

            function getY(canvasY) {
                let y = canvasY * scale + offsetY;
                return flipY ? tableSize - y : y;
            }

            // Add drawing strokes
            for (let stroke of strokes) {
                if (stroke.length === 0) continue;

                let x = Math.min(Math.max(getX(stroke[0].x), 0), tableSize);
                let y = Math.min(Math.max(getY(stroke[0].y), 0), tableSize);
                
                // CHANGED: Replaced G0 with G1 so the magnet doesn't drop the ball
                gcode.push(`G1 X${x.toFixed(2)} Y${y.toFixed(2)} F1000`);

                for (let i = 1; i < stroke.length; i++) {
                    x = Math.min(Math.max(getX(stroke[i].x), 0), tableSize);
                    y = Math.min(Math.max(getY(stroke[i].y), 0), tableSize);
                    gcode.push(`G1 X${x.toFixed(2)} Y${y.toFixed(2)} F1000`);
                }
            }

            // --- UPDATED TEXT GCODE GENERATION ---
            for (let textElem of textElements) {
                const txtScale = textElem.fontSize / 20;
                let cursorX = textElem.x;
                const charSpacing = 12 * txtScale;
                const str = textElem.text.toUpperCase();

                for(let char of str) {
                    if(fontData[char]) {
                        for(let line of fontData[char]) {
                            // Move to start of letter segment (CHANGED TO G1)
                            let lx = Math.min(Math.max(getX(cursorX + line[0] * txtScale), 0), tableSize);
                            let ly = Math.min(Math.max(getY(textElem.y + line[1] * txtScale), 0), tableSize);
                            gcode.push(`G1 X${lx.toFixed(2)} Y${ly.toFixed(2)} F1000`);

                            // Draw the segment
                            for(let k=2; k<line.length; k+=2) {
                                lx = Math.min(Math.max(getX(cursorX + line[k] * txtScale), 0), tableSize);
                                ly = Math.min(Math.max(getY(textElem.y + line[k+1] * txtScale), 0), tableSize);
                                gcode.push(`G1 X${lx.toFixed(2)} Y${ly.toFixed(2)} F1000`);
                            }
                        }
                    }
                    cursorX += charSpacing;
                }
            }

            // Return to home slowly (CHANGED TO G1)
            gcode.push('G1 X0 Y0 F1000');
            gcode.push('M30');

            return gcode.join('\n');
        }

        function updateGcodePreview() {
            const gcode = convertToGCode();
            gcodePreview.value = gcode;
        }

        function downloadGCode() {
            if (strokes.length === 0 && textElements.length === 0) {
                alert('Please draw something first!');
                return;
            }

            const gcode = convertToGCode();
            const filename = document.getElementById('filenameInput').value.trim() || 'drawing';
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(gcode));
            element.setAttribute('download', filename + '.gcode');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
