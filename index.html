<!DOCTYPE html>
<html>
<head>
    <title>Sand Table G-Code Gen</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        /* --- Top Right Light Controls --- */
        .top-right-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }

        .light-btn {
            width: auto;
            height: auto;
            padding: 12px 24px;
            flex-direction: row;
            font-size: 16px;
            background-color: #f39c12;
            gap: 8px;
        }

        .light-btn:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* --- Custom Color Picker Modal --- */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .color-preview {
            width: 100%;
            height: 80px;
            border-radius: 10px;
            background-color: rgb(255, 255, 255);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid #ccc;
            margin-bottom: 10px;
        }

        .slider-group {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .slider-group label {
            font-weight: bold;
            width: 20px;
        }

        /* Custom colored sliders */
        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }
        #r-slider { accent-color: red; }
        #g-slider { accent-color: green; }
        #b-slider { accent-color: blue; }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .modal-btn {
            flex: 1;
            height: 50px;
            width: auto;
            font-size: 16px;
        }

        .apply-btn { background-color: #2ecc71; }
        .apply-btn:hover { background-color: #27ae60; }
        .close-btn { background-color: #e74c3c; }
        .close-btn:hover { background-color: #c0392b; }

        /* --- Main Menu Styles --- */
        h1 {
            font-size: 60px;
            text-align: center;
            margin: 30px 0;
            color: #333;
        }

        .button-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 0;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #3498db;
            color: white;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .button-icon { font-size: 60px; }
        .button-text { font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    
    <div class="top-right-controls">
        <button class="light-btn" onclick="openModal()">
            💡 <span class="button-text">Light Color</span>
        </button>
    </div>

    <div class="modal-overlay" id="colorModal">
        <div class="modal-content">
            <h2>Pick a Color</h2>
            
            <div class="color-preview" id="previewBox"></div>
            
            <div class="slider-group">
                <label style="color: red;">R</label>
                <input type="range" id="r-slider" min="0" max="255" value="255" oninput="updatePreview()">
            </div>
            <div class="slider-group">
                <label style="color: green;">G</label>
                <input type="range" id="g-slider" min="0" max="255" value="255" oninput="updatePreview()">
            </div>
            <div class="slider-group">
                <label style="color: blue;">B</label>
                <input type="range" id="b-slider" min="0" max="255" value="255" oninput="updatePreview()">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn close-btn" onclick="closeModal()">Cancel</button>
                <button class="modal-btn apply-btn" onclick="applyColor()">Apply</button>
            </div>
        </div>
    </div>

    <h1>Sand Table</h1>
    <div class="button-container">
        <button onclick="window.location.href='draw.html'">
            <div class="button-icon">✏️</div>
            <div class="button-text">Draw</div>
        </button>
        <button onclick="window.location.href='patterns.html'">
            <div class="button-icon">🌀</div>
            <div class="button-text">Patterns</div>
        </button>
        <button onclick="window.location.href='upload.html'">
            <div class="button-icon">🖼️</div>
            <div class="button-text">Image</div>
        </button>
    </div>

    <script>
        // REPLACE THIS with the IP address printed in your ESP32 Serial Monitor
        const esp32_ip = "192.168.1.50"; 

        const modal = document.getElementById('colorModal');
        const previewBox = document.getElementById('previewBox');
        const rSlider = document.getElementById('r-slider');
        const gSlider = document.getElementById('g-slider');
        const bSlider = document.getElementById('b-slider');

        // Open the modal
        function openModal() {
            modal.style.display = 'flex';
            updatePreview(); // Ensure the box matches current sliders
        }

        // Close the modal
        function closeModal() {
            modal.style.display = 'none';
        }

        // Update the preview box color while dragging sliders
        function updatePreview() {
            const r = rSlider.value;
            const g = gSlider.value;
            const b = bSlider.value;
            previewBox.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        // Send the color to the ESP32
        function applyColor() {
            const r = rSlider.value;
            const g = gSlider.value;
            const b = bSlider.value;

            console.log(`Sending RGB to ESP32: ${r}, ${g}, ${b}`);

            // Send the request to the ESP32 via Fetch API
            fetch(`http://${esp32_ip}/setColor?r=${r}&g=${g}&b=${b}`, { mode: 'no-cors' })
                .then(() => {
                    console.log("Color command sent successfully!");
                    closeModal(); // Close the modal after sending
                })
                .catch(err => {
                    console.error("Failed to reach ESP32. Ensure both devices are on the same Wi-Fi.", err);
                    alert("Error communicating with ESP32. Check console.");
                });
        }

        // Close modal if user clicks outside of the white box
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
