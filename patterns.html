<!DOCTYPE html>
<html>
<head>
    <title>Sand Table Patterns</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1 {
            margin-bottom: 20px;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .pattern-card {
            background: white;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .pattern-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-color: #2980b9;
        }

        .pattern-preview {
            width: 100%;
            height: 150px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .pattern-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .pattern-description {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .pattern-download {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .pattern-download:hover {
            background-color: #229954;
        }

        #backBtn {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #backBtn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <button id="backBtn">← Back to Menu</button>
    <h1>Sand Table Patterns</h1>
    <p>Select a pattern to download as G-Code</p>

    <div style="margin-bottom: 20px; text-align: center;">
        <input type="text" id="filenameInput" placeholder="filename" value="pattern" style="padding: 8px; font-size: 14px;">
        <span style="margin: 0 5px;">.gcode</span>
    </div>

    <div class="pattern-grid" id="patternGrid"></div>

    <script>
    // Configuration
    const TABLE_SIZE = 370;
    const CENTER = TABLE_SIZE / 2; // = 185
    const MAX_R = CENTER - 10;     // = 175 (leaving 10mm buffer)
    
        const patterns = [
    {
        name: "Spiral",
        description: "A smooth spiral pattern",
        generate: function() {
            let points = [];
            const centerX = CENTER, centerY = CENTER;
            const maxRadius = MAX_R;
            // Increased loops slightly to fill the larger space
            for (let angle = 0; angle < Math.PI * (237/4); angle += 0.05) {
                const radius = (angle / (Math.PI * (237/4))) * maxRadius;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                points.push({ x, y });
            }
            return [points];
        }
    },
    {
        name: "Spirograph",
        description: "Intricate Sisyphus-style loops",
        generate: function() {
            let points = [];
            const centerX = CENTER, centerY = CENTER;
            // Scaled up radii for 370mm table
            const R = 150;  // Outer radius
            const r = 92;   // Inner radius
            const d = 50;   // Pen offset
            
            for (let t = 0; t < Math.PI * 60; t += 0.05) {
                const x = centerX + (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
                const y = centerY + (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
                points.push({ x, y });
            }
            return [points];
        }
    },
    {
    name: "Reset",
    description: "Continuous zig-zag lines to smooth the sand",
    generate: function() {
        let singleStroke = [];
        const lineSpacing = 10; 
        const maxY = 360; // Hard-coded stopping point for the Y axis
        let goingRight = true;
        
        // Generate a continuous path up to y = 360
        for (let y = 0; y <= maxY; y += lineSpacing) {
            
            if (goingRight) {
                // Draw left to right
                for (let x = 0; x <= TABLE_SIZE; x += 2) {
                    singleStroke.push({ x, y });
                }
            } else {
                // Draw right to left
                for (let x = TABLE_SIZE; x >= 0; x -= 2) {
                    singleStroke.push({ x, y });
                }
            }
            
            // Flip the direction for the next row
            goingRight = !goingRight; 
        }
        // Final move: travel straight down the right edge to 370, 0
        singleStroke.push({ x: 370, y: 0 });
        // Return as a single continuous stroke to prevent G0 jumps
        return [singleStroke]; 
    }
},
 {
        name: "Cross",
        description: "Traditional Latin cross pattern",
        generate: function() {
            let strokes = [];
            
            // --- Configuration for 370x370 Table ---
            const thick = 40;        // Thickness of the bars
            const cx = CENTER;       // 185
            
            // Define fixed boundary lines to create the Latin Cross shape
            // Top of the cross (near the top of table)
            const vTop = 40;        
            // Bottom of the cross (near bottom of table)
            const vBottom = 330;    
            
            // The Horizontal Arm (Placed higher up at y=110 to y=150)
            const hTop = 110;
            const hBottom = hTop + thick;
            const hLeft = 55;       // Left edge of arm
            const hRight = 315;     // Right edge of arm

            // The Vertical Bar Width
            const vLeft = cx - (thick / 2);
            const vRight = cx + (thick / 2);

            let outline = [];

            // 1. Top Edge
            for (let x = vLeft; x <= vRight; x += 2) outline.push({ x, y: vTop });

            // 2. Vertical Bar (Right Side - Top section)
            for (let y = vTop; y <= hTop; y += 2) outline.push({ x: vRight, y });

            // 3. Horizontal Arm (Right Arm - Top edge)
            for (let x = vRight; x <= hRight; x += 2) outline.push({ x, y: hTop });

            // 4. Horizontal Arm (Right Edge)
            for (let y = hTop; y <= hBottom; y += 2) outline.push({ x: hRight, y });

            // 5. Horizontal Arm (Right Arm - Bottom edge)
            for (let x = hRight; x >= vRight; x -= 2) outline.push({ x, y: hBottom });

            // 6. Vertical Bar (Right Side - Bottom section - The long part)
            for (let y = hBottom; y <= vBottom; y += 2) outline.push({ x: vRight, y });

            // 7. Bottom Edge
            for (let x = vRight; x >= vLeft; x -= 2) outline.push({ x, y: vBottom });

            // 8. Vertical Bar (Left Side - Bottom section)
            for (let y = vBottom; y >= hBottom; y -= 2) outline.push({ x: vLeft, y });

            // 9. Horizontal Arm (Left Arm - Bottom edge)
            for (let x = vLeft; x >= hLeft; x -= 2) outline.push({ x, y: hBottom });

            // 10. Horizontal Arm (Left Edge)
            for (let y = hBottom; y >= hTop; y -= 2) outline.push({ x: hLeft, y });

            // 11. Horizontal Arm (Left Arm - Top edge)
            for (let x = hLeft; x <= vLeft; x += 2) outline.push({ x, y: hTop });

            // 12. Vertical Bar (Left Side - Top section)
            for (let y = hTop; y >= vTop; y -= 2) outline.push({ x: vLeft, y });

            strokes.push(outline);
            return strokes;
        }
    },
    {
    name: "Interlocking Wavy Spiral",
    description: "A continuous spiraling sine wave that creates an interlocking optical illusion",
    generate: function() {
        let singleStroke = [];
        const TABLE_SIZE = 370; 
        const centerX = TABLE_SIZE / 2; // 185
        const centerY = TABLE_SIZE / 2; // 185
        const maxRadius = (TABLE_SIZE / 2) - 2; // -2mm to keep the ball from hitting the very edge
        
        // --- PATTERN SETTINGS ---
        // Tweak these to change the look of the sand!
        const revolutions = 19.625;      // How many times the spiral loops around the center
        const wigglesPerRev = 40.1; // Number of wave peaks per loop. Decimals like .25 or .5 create the swirl effect!
        const maxAmplitude = 5;    // How wide the wave wiggles (in mm)
        
        const maxTheta = revolutions * 2 * Math.PI;
        const thetaStep = 0.02; // Resolution of the curve. Lower is smoother, but creates more G-code
        
        // Generate the continuous path from the center outward
        for (let theta = 0; theta <= maxTheta; theta += thetaStep) {
            
            // 1. Calculate the base expanding spiral
            let progress = theta / maxTheta; 
            let baseRadius = progress * maxRadius;
            
            // 2. Calculate the wave size. 
            // We scale the amplitude by 'progress' so it starts as a tiny wiggle in the 
            // center and grows to the maxAmplitude at the edge. This prevents the ball 
            // from making a messy, overlapping knot right in the middle.
            let currentAmplitude = maxAmplitude * progress;
            
            // 3. Combine them
            let r = baseRadius + (currentAmplitude * Math.sin(theta * wigglesPerRev));
            
            // 4. Convert polar coordinates (radius/angle) back to Cartesian (X/Y)
            let x = centerX + r * Math.cos(theta);
            let y = centerY + r * Math.sin(theta);
            
            singleStroke.push({ x: x, y: y });
        }
        
        
        
        return [singleStroke];
    }
},
    {
        name: "Grid",
        description: "A geometric grid pattern",
        generate: function() {
            let strokes = [];
            const spacing = 30; // Increased spacing for larger table
            const start = 20;
            const end = TABLE_SIZE - 20;
            
            // Horizontal lines
            for (let y = start; y <= end; y += spacing) {
                let stroke = [];
                for (let x = start; x <= end; x += 5) {
                    stroke.push({ x, y });
                }
                strokes.push(stroke);
            }
            
            // Vertical lines
            for (let x = start; x <= end; x += spacing) {
                let stroke = [];
                for (let y = start; y <= end; y += 5) {
                    stroke.push({ x, y });
                }
                strokes.push(stroke);
            }
            return strokes;
        }
    },
    {
        name: "Circles",
        description: "Concentric circles",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            // Added more circles and larger radii
            const radii = [30, 60, 90, 120, 150];
            
            for (let radius of radii) {
                let stroke = [];
                for (let angle = 0; angle < Math.PI * 2; angle += 0.05) {
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);
                    stroke.push({ x, y });
                }
                strokes.push(stroke);
            }
            return strokes;
        }
    },
    {
        name: "Wave",
        description: "Flowing wave pattern",
        generate: function() {
            let strokes = [];
            const amplitude = 60; // Larger waves
            const frequency = 0.03; // Smoother frequency
            
            // Covers the whole 370 height
            for (let startY = 40; startY < TABLE_SIZE - 40; startY += 30) {
                let stroke = [];
                for (let x = 20; x < TABLE_SIZE - 20; x += 2) {
                    const y = startY + amplitude * Math.sin(x * frequency);
                    // Ensure we stay in bounds
                    if (y > 0 && y < TABLE_SIZE) {
                        stroke.push({ x, y });
                    }
                }
                strokes.push(stroke);
            }
            return strokes;
        }
    },
    {
        name: "Star",
        description: "A geometric star shape",
        generate: function() {
            let points = [];
            const centerX = CENTER, centerY = CENTER;
            const points_count = 5;
            const outerRadius = MAX_R - 10; // 165mm
            const innerRadius = 60;         // Scaled up
            
            for (let i = 0; i < points_count * 2; i++) {
                const angle = (i * Math.PI) / points_count - Math.PI / 2;
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                points.push({ x, y });
            }
            points.push(points[0]); // Close the star
            return [points];
        }
    },
    {
        name: "Mandala",
        description: "Decorative mandala pattern",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            
            for (let layer = 1; layer <= 4; layer++) {
                const radius = layer * 35; // Increased spacing
                const petals = layer * 4;  // More petals
                
                for (let petal = 0; petal < petals; petal++) {
                    let stroke = [];
                    const baseAngle = (petal * Math.PI * 2) / petals;
                    
                    for (let angle = baseAngle; angle < baseAngle + Math.PI / petals; angle += 0.05) {
                        const r = radius * Math.sin(angle - baseAngle) / Math.sin(Math.PI / petals);
                        const x = centerX + r * Math.cos(angle);
                        const y = centerY + r * Math.sin(angle);
                        stroke.push({ x, y });
                    }
                    strokes.push(stroke);
                }
            }
            return strokes;
        }
    },
   
    
    {
        name: "Sunburst",
        description: "Radial lines emanating from center",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            const numRays = 24; // More rays for bigger table
            const radius = MAX_R;
            
            for (let i = 0; i < numRays; i++) {
                const angle = (i * Math.PI * 2) / numRays;
                let ray = [];
                for (let r = 0; r <= radius; r += 2) {
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    ray.push({ x, y });
                }
                strokes.push(ray);
            }
            return strokes;
        }
    },
    {
        name: "Concentric Squares",
        description: "Nested square patterns",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            const squareSizes = [40, 80, 120, 160];
            
            for (let size of squareSizes) {
                let square = [];
                // Top
                for (let x = centerX - size; x <= centerX + size; x += 2) 
                    square.push({ x, y: centerY - size });
                // Right
                for (let y = centerY - size; y <= centerY + size; y += 2) 
                    square.push({ x: centerX + size, y });
                // Bottom
                for (let x = centerX + size; x >= centerX - size; x -= 2) 
                    square.push({ x, y: centerY + size });
                // Left
                for (let y = centerY + size; y >= centerY - size; y -= 2) 
                    square.push({ x: centerX - size, y });
                    
                strokes.push(square);
            }
            return strokes;
        }
    },
    {
        name: "Hexagon",
        description: "Regular hexagon pattern",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            const radius = 150; // Scaled up
            let hex = [];
            
            for (let i = 0; i < 7; i++) {
                const angle = (i * Math.PI) / 3;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                hex.push({ x, y });
            }
            strokes.push(hex);
            return strokes;
        }
    },
    {
        name: "Diagonal Lines",
        description: "Crisscross diagonal pattern",
        generate: function() {
            let strokes = [];
            const spacing = 15;
            
            // Top-left to bottom-right
            // Offset range increased for 370 table
            for (let offset = -TABLE_SIZE; offset <= TABLE_SIZE; offset += spacing) {
                let line = [];
                for (let x = 0; x <= TABLE_SIZE; x += 5) {
                    const y = x + offset;
                    if (y >= 0 && y <= TABLE_SIZE) {
                        line.push({ x, y });
                    }
                }
                if (line.length > 0) strokes.push(line);
            }
            
            // Top-right to bottom-left
            for (let offset = 0; offset <= TABLE_SIZE * 2; offset += spacing) {
                let line = [];
                for (let x = 0; x <= TABLE_SIZE; x += 5) {
                    const y = offset - x;
                    if (y >= 0 && y <= TABLE_SIZE) {
                        line.push({ x, y });
                    }
                }
                if (line.length > 0) strokes.push(line);
            }
            return strokes;
        }
    },
    {
        name: "Rose",
        description: "Rose-shaped curve pattern",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            const petals = 6;
            const scale = 160; // Scale determines the radius
            let rose = [];
            
            for (let angle = 0; angle < Math.PI * 2; angle += 0.02) {
                const r = scale * Math.cos(petals * angle);
                // Allow negative r for full rose loops
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                rose.push({ x, y });
            }
            strokes.push(rose);
            return strokes;
        }
    },
    {
        name: "Checkerboard",
        description: "Checkerboard grid pattern",
        generate: function() {
            let strokes = [];
            const squareSize = 30; // Larger squares
            
            for (let y = 0; y < TABLE_SIZE; y += squareSize) {
                let hLine = [];
                for (let x = 0; x <= TABLE_SIZE; x += 2) {
                    hLine.push({ x, y });
                }
                strokes.push(hLine);
            }
            
            for (let x = 0; x < TABLE_SIZE; x += squareSize) {
                let vLine = [];
                for (let y = 0; y <= TABLE_SIZE; y += 2) {
                    vLine.push({ x, y });
                }
                strokes.push(vLine);
            }
            return strokes;
        }
    },
    {
        name: "Infinity",
        description: "Infinity symbol pattern",
        generate: function() {
            let strokes = [];
            const centerX = CENTER, centerY = CENTER;
            let infinity = [];
            const size = 120; // Scale factor
            
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                const scale = 2 / (3 - Math.cos(2*t));
                const x = centerX + size * scale * Math.cos(t);
                const y = centerY + size * scale * Math.sin(2*t) / 2;
                infinity.push({ x, y });
            }
            strokes.push(infinity);
            return strokes;
        }
    }
];

        function drawPatternPreview(canvas, patternFunc) {
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const strokes = patternFunc();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Scale to canvas size (180mm table to canvas)
            const scale = canvas.width / 370;
            
            for (let stroke of strokes) {
                if (stroke.length === 0) continue;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x * scale, stroke[0].y * scale);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x * scale, stroke[i].y * scale);
                }
                ctx.stroke();
            }
        }

        function generateGCode(strokes) {
            let gcode = [];
            gcode.push('G90'); // Absolute positioning
            gcode.push('G21'); // Millimeters

            for (let stroke of strokes) {
                if (stroke.length === 0) continue;

                // Move to first point
                let x = stroke[0].x;
                let y = stroke[0].y;
                gcode.push(`G0 X${x.toFixed(2)} Y${y.toFixed(2)}`);

                // Draw line segments
                for (let i = 1; i < stroke.length; i++) {
                    x = stroke[i].x;
                    y = stroke[i].y;
                    gcode.push(`G1 X${x.toFixed(2)} Y${y.toFixed(2)} F2000`);
                }
            }

            gcode.push('G0 X0 Y0'); // Return to origin
            gcode.push('M30'); // End of program

            return gcode.join('\n');
        }

        function downloadPattern(name, patternFunc) {
            const strokes = patternFunc();
            const gcode = generateGCode(strokes);
            const filename = document.getElementById('filenameInput').value.trim() || 'pattern';
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(gcode));
            element.setAttribute('download', filename + '.gcode');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // Populate pattern grid
        const patternGrid = document.getElementById('patternGrid');
        patterns.forEach(pattern => {
            const card = document.createElement('div');
            card.className = 'pattern-card';
            
            const canvas = document.createElement('canvas');
            canvas.className = 'pattern-preview';
            canvas.width = 150;
            canvas.height = 150;
            drawPatternPreview(canvas, pattern.generate);
            
            const name = document.createElement('div');
            name.className = 'pattern-name';
            name.textContent = pattern.name;
            
            const desc = document.createElement('div');
            desc.className = 'pattern-description';
            desc.textContent = pattern.description;
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'pattern-download';
            downloadBtn.textContent = 'Download G-Code';
            downloadBtn.onclick = () => downloadPattern(pattern.name, pattern.generate);
            
            card.appendChild(canvas);
            card.appendChild(name);
            card.appendChild(desc);
            card.appendChild(downloadBtn);
            patternGrid.appendChild(card);
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
