<!DOCTYPE html>
<html>
<head>
    <title>Upload Image to G-Code</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1 {
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .upload-controls {
            border: 2px solid #3498db;
            border-radius: 5px;
            padding: 20px;
            background-color: #e8f4f8;
            margin-bottom: 20px;
            width: 500px;
            box-sizing: border-box;
        }

        .upload-controls label {
            font-weight: bold;
            color: #3498db;
            display: block;
            margin-bottom: 10px;
        }

        input[type="file"] {
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
        }

        input[type="range"] {
            width: 300px;
            height: 8px;
            margin-bottom: 10px;
        }

        .threshold-value {
            margin-left: 10px;
            font-weight: bold;
        }

        canvas {
            border: 2px solid #333;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: none;
        }

        canvas.active {
            display: block;
        }

        .preview-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preview-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
        }

        button:hover {
            background-color: #2980b9;
        }

        #downloadBtn {
            background-color: #27ae60;
        }

        #downloadBtn:hover {
            background-color: #229954;
        }

        #backBtn {
            background-color: #95a5a6;
        }

        #backBtn:hover {
            background-color: #7f8c8d;
        }

        #gcodePreview {
            width: 400px;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
            background: #1a252f;
            color: #1abc9c;
            border: 1px solid #34495e;
            padding: 10px;
            border-radius: 5px;
            overflow: auto;
            display: none;
        }

        #gcodePreview.active {
            display: block;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Upload Image to G-Code</h1>
    <p style="color: #666; margin: 0 0 20px 0;">Sand Table: 180mm × 180mm</p>

    <div class="controls">
        <button id="backBtn">Back to Menu</button>
    </div>

    <div class="upload-controls">
        <label for="imageInput">Upload an image:</label>
        <input type="file" id="imageInput" accept="image/*">
        
        <div>
            <label>Threshold (lower = more detail): 
                <input type="range" id="thresholdSlider" min="0" max="255" value="128">
                <span class="threshold-value" id="thresholdValue">128</span>
            </label>
        </div>

        <div>
            <label>
                <input type="checkbox" id="invertCheckbox">
                Invert (draw bright areas instead of dark)
            </label>
        </div>
        <div>
            <label>Draw Speed (mm/min): 
                <input type="number" id="speedInput" min="100" max="10000" value="1500" step="100" style="padding: 5px; width: 80px;">
            </label>
        </div>

        <button id="convertBtn">Convert to G-Code</button>
    </div>

    <canvas id="previewCanvas"></canvas>

    <div class="preview-row">
        <div class="preview-column">
            <div class="preview-label">Image Preview</div>
            <canvas id="imagePreviewCanvas" width="250" height="250" style="border: 1px solid #ddd; display: none;"></canvas>
        </div>
        <div class="preview-column">
            <div class="preview-label">G-Code Path Preview</div>
            <canvas id="gcodePathCanvas" width="250" height="250" style="border: 1px solid #ddd; display: none;"></canvas>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="filenameInput" placeholder="filename" value="image">
        <span>.gcode</span>
        <button id="downloadBtn">Download G-Code</button>
    </div>

    <h3>G-Code Preview:</h3>
    <textarea id="gcodePreview" readonly></textarea>

    <script>
    const imageInput = document.getElementById('imageInput');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValue = document.getElementById('thresholdValue');
    const invertCheckbox = document.getElementById('invertCheckbox');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const backBtn = document.getElementById('backBtn');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const imagePreviewCanvas = document.getElementById('imagePreviewCanvas');
    const imagePreviewCtx = imagePreviewCanvas.getContext('2d');
    const gcodePathCanvas = document.getElementById('gcodePathCanvas');
    const gcodePathCtx = gcodePathCanvas.getContext('2d');
    const gcodePreview = document.getElementById('gcodePreview');
    const speedInput = document.getElementById('speedInput');

    let currentImageData = null;
    let generatedGCode = '';

    thresholdSlider.addEventListener('input', (e) => {
        thresholdValue.textContent = e.target.value;
    });

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                // 1. Set canvas size to match image
                previewCanvas.width = img.width;
                previewCanvas.height = img.height;

                // 2. CRITICAL FIX: Fill canvas with WHITE first
                // This prevents transparent backgrounds from being read as black (drawing zones)
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

                // 3. Draw the image on top of the white background
                ctx.drawImage(img, 0, 0);
                
                // 4. Update preview
                previewCanvas.classList.add('active');
                currentImageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
                
                imagePreviewCtx.fillStyle = "#FFFFFF";
                imagePreviewCtx.fillRect(0, 0, imagePreviewCanvas.width, imagePreviewCanvas.height);
                imagePreviewCtx.drawImage(img, 0, 0, imagePreviewCanvas.width, imagePreviewCanvas.height);
                imagePreviewCanvas.style.display = 'block';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    convertBtn.addEventListener('click', () => {
        if (!currentImageData) {
            alert('Please upload an image first!');
            return;
        }
        const threshold = parseInt(thresholdSlider.value);
        const invert = invertCheckbox.checked;
        const speed = parseInt(speedInput.value); // Grab the speed from the box
        
        // Pass the speed variable into the function
        generatedGCode = imageToGCode(currentImageData, threshold, invert, speed); 
        
        gcodePreview.value = generatedGCode;
        gcodePreview.classList.add('active');
        drawGCodePreview(generatedGCode);
    });

    downloadBtn.addEventListener('click', () => {
        if (!generatedGCode) return;
        const filename = document.getElementById('filenameInput').value.trim() || 'image';
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(generatedGCode));
        element.setAttribute('download', filename + '.gcode');
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    });

    backBtn.addEventListener('click', () => window.location.href = 'index.html');

    function imageToGCode(imageData, threshold, invert = false, speed = 1500) {
    const width = imageData.width;
    const height = imageData.height;
    const data = imageData.data;
    
    // --- SETTINGS: ADJUST SIZE HERE ---
    const tableWidth = 370;  // Change this to your X size
    const tableHeight = 370; // Change this to your Y size (usually same as X)
    const density = 75; 
    const jumpThreshold = 15.0; 
    // ----------------------------------
    
    let gcode = ['G90', 'G21', `G1 F${speed}`];
    
    // 1. Collect all "draw points"
    let points = [];
    const step = Math.max(1, Math.floor(width / density));
    
    const scaleX = tableWidth / width;
    const scaleY = tableHeight / height;

    for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
            const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
            const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            
            const isTarget = invert ? (brightness > threshold) : (brightness < threshold);
            
            if (isTarget) {
                points.push({
                    x: x * scaleX,
                    y: (height - y) * scaleY,
                    visited: false
                });
            }
        }
    }

    // 2. Connect the dots
    let currentX = 0;
    let currentY = tableHeight; // Start at Home (Top-Left)
    let pointsRemaining = points.length;

    while (pointsRemaining > 0) {
        let minDist = Infinity;
        let nearestIdx = -1;

        for (let i = 0; i < points.length; i++) {
            if (points[i].visited) continue;

            const dx = points[i].x - currentX;
            const dy = points[i].y - currentY;
            const distSq = dx*dx + dy*dy; 

            if (distSq < minDist) {
                minDist = distSq;
                nearestIdx = i;
                if (distSq < 4) break; 
            }
        }

        if (nearestIdx !== -1) {
            const p = points[nearestIdx];
            const dist = Math.sqrt(minDist);

            // 3. MOVEMENT LOGIC
            if (dist > jumpThreshold) {
                // Determine nearest wall dynamically based on tableWidth
                let wallX = currentX > (tableWidth / 2) ? tableWidth : 0;
                
                gcode.push(`G1 X${wallX} Y${currentY.toFixed(2)}`);
                gcode.push(`G1 X${wallX} Y${p.y.toFixed(2)}`);
                gcode.push(`G1 X${p.x.toFixed(2)} Y${p.y.toFixed(2)}`);
            } else {
                gcode.push(`G1 X${p.x.toFixed(2)} Y${p.y.toFixed(2)}`);
            }

            currentX = p.x;
            currentY = p.y;
            points[nearestIdx].visited = true;
            pointsRemaining--;
        } else {
            break; 
        }
    }

    // Go Home (Using dynamic height)
    gcode.push(`G1 X0 Y${tableHeight}`); 
    gcode.push('M30');
    
    return gcode.join('\n');
}

    // --- PREVIEW FUNCTION (Unchanged but ensures clean clearing) ---
    function drawGCodePreview(gcode) {
        gcodePathCtx.fillStyle = '#FFFFFF';
        gcodePathCtx.fillRect(0, 0, gcodePathCanvas.width, gcodePathCanvas.height);
        
        gcodePathCtx.strokeStyle = '#000000';
        gcodePathCtx.lineWidth = 1;
        gcodePathCtx.beginPath();

        const lines = gcode.split('\n');
        const scale = gcodePathCanvas.width / 370;
        let curX = 0, curY = 0;

        for (let line of lines) {
            const match = line.match(/X([\d.-]+)\s+Y([\d.-]+)/);
            if (match) {
                const x = parseFloat(match[1]) * scale;
                const y = parseFloat(match[2]) * scale; // Flip Y for canvas if needed, but 0,0 is usually top-left
                if (line.includes('G1')) {
                    gcodePathCtx.moveTo(curX, curY);
                    gcodePathCtx.lineTo(x, y);
                }
                curX = x;
                curY = y;
            }
        }
        gcodePathCtx.stroke();
        gcodePathCanvas.style.display = 'block';
    }
</script>
</body>
</html>
